<!DOCTYPE html>

    <style>
        @font-face {
            font-family: 'ouroboros';
            src: url('ouroboros.ttf') format('truetype');
            font-display: swap;
        }
        body { 
            margin: 0; padding: 0; background: #111; color: white; 
            font-family: 'ouroboros', sans-serif; overflow: hidden; 
            touch-action: none; user-select: none; -webkit-user-select: none; 
        }
        canvas { display: block; touch-action: none; }
        .font-preloader { position: absolute; opacity: 0; pointer-events: none; font-family: 'ouroboros'; }

        #pause-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .settings-group {
            background: #ff85a2;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 80%;
            max-width: 280px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .slider-container { margin: 15px 0; color: white; }
        input[type=range] { width: 100%; accent-color: white; margin-top: 5px; }
        .pause-btn {
            display: block; width: 100%; margin-top: 12px;
            padding: 12px; background: white; color: #ff85a2;
            border: none; border-radius: 12px; font-family: 'ouroboros';
            font-size: 18px; cursor: pointer;
        }
        #debug-menu {
            position: absolute;
            top: 10px; left: 10px;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px; border-radius: 10px;
            display: none; flex-direction: column;
            z-index: 9999; border: 1px solid #ffed00;
        }
        .debug-row { margin: 5px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 14px; }
        .debug-btn { padding: 5px; background: #444; color: white; border: 1px solid #777; font-family: sans-serif; cursor: pointer; }
    </style>
</head>
<body>
<div class="font-preloader">котики прелоад</div>
<canvas id="game"></canvas>

<div id="pause-overlay">

        <h2 style="margin:0 0 10px 0">Пауза</h2>
        <div class="slider-container">
            <label>Музыка 🎵</label>
            <input type="range" id="musicVol" min="0" max="1" step="0.1">
        </div>
        <div class="slider-container">
            <label>Звуки 🔊</label>
            <input type="range" id="sfxVol" min="0" max="1" step="0.1">
        </div>
        <button class="pause-btn" onclick="resumeGame()">Продолжить</button>
        <button class="pause-btn" style="background:#ffb7c5" onclick="goToMenu()">В меню</button>
    </div>
</div>

<div id="debug-menu">

    <div class="debug-row">

function getRandomSkinKey(isPity = false) {
    const lockedBoxSkins = Object.keys(skinsDB).filter(key => skinsDB[key].boxSkin && !skinsDB[key].unlocked);
    if (isPity && lockedBoxSkins.length > 0) {
        return lockedBoxSkins[Math.floor(Math.random() * lockedBoxSkins.length)];
    }
    const availableKeys = Object.keys(skinsDB).filter(key => {
        const w = skinsDB[key].weight;
        return w !== undefined ? w > 0 : true;
    });
    if (availableKeys.length === 0) return "cat";
    let totalWeight = availableKeys.reduce((sum, key) => {
        let w = skinsDB[key].weight !== undefined ? skinsDB[key].weight : 100;
        if (skinsDB[key].unlocked) w = Math.max(5, Math.floor(w * 0.2));
        return sum + w;
    }, 0);
    let randomNum = Math.random() * totalWeight;
    for (let key of availableKeys) {
        let weight = skinsDB[key].weight !== undefined ? skinsDB[key].weight : 100;
        if (skinsDB[key].unlocked) weight = Math.max(5, Math.floor(weight * 0.2));
        if (randomNum < weight) return key;
        randomNum -= weight;
    }
    return availableKeys[0];
}

function unlockAchievement(id) {
    if (!achievementsDB[id] || achievementsDB[id].unlocked) return;
    achievementsDB[id].unlocked = true;
    if (achievementsDB[id].rewardSkin && skinsDB[achievementsDB[id].rewardSkin]) {
        skinsDB[achievementsDB[id].rewardSkin].unlocked = true;
    }

    sndAchievement.volume = sfxVolume;
    sndAchievement.currentTime = 0;
    sndAchievement.play().catch(() => {});
    achievementQueue.push(achievementsDB[id]);
}

function checkAchievements() {
    if (score >= 10) unlockAchievement("first_step");
    if (nyanCount >= 15) unlockAchievement("nyan_lover");
    if (coins >= 50) unlockAchievement("rich_cat");
    if (isCyberMode) unlockAchievement("cyber_shooter");
    if (isTimeParadox) unlockAchievement("time_master");
    if (isGlitchMode) unlockAchievement("windows_error");
    if (itemsDB.poptart && itemsDB.hourglass && itemsDB.gun && itemsDB.cursor && itemsDB.lightning && itemsDB.umbrella &&
        itemsDB.poptart.unlocked && itemsDB.hourglass.unlocked && itemsDB.gun.unlocked && itemsDB.cursor.unlocked && itemsDB.lightning.unlocked && itemsDB.umbrella.unlocked) {
        unlockAchievement("the_four");
    }
    let allBoxSkinsUnlocked = Object.keys(skinsDB).filter(k => skinsDB[k].boxSkin).every(k => skinsDB[k].unlocked);
    if (allBoxSkinsUnlocked) unlockAchievement("casino");
    let allItemsUnlocked = Object.keys(itemsDB).every(k => itemsDB[k].unlocked);
    if (allItemsUnlocked) unlockAchievement("vacuum_cleaner");
}

function drawAchievementNotification() {
    if (!currentAchievementPopup && achievementQueue.length > 0) {
        currentAchievementPopup = achievementQueue.shift();
        achievementPopupTimer = 180;
    }
    if (currentAchievementPopup) {
        achievementPopupTimer--;
        let popupY = -70;
        if (achievementPopupTimer > 150) popupY = -70 + (180 - achievementPopupTimer) * 3; 
        else if (achievementPopupTimer < 30) popupY = 20 - (30 - achievementPopupTimer) * 3;
        else popupY = 20;

        const boxW = Math.min(W - 40, 300);
        const boxX = (W - boxW) / 2;

        ctx.save();
        ctx.fillStyle = "rgba(20, 20, 20, 0.95)";
        ctx.strokeStyle = "#ffed00";
        ctx.lineWidth = 2;
        ctx.fillRect(boxX, popupY, boxW, 60);
        ctx.strokeRect(boxX, popupY, boxW, 60);

        ctx.font = "24px 'ouroboros'";
        ctx.textAlign = "left";
        ctx.fillText("🏆", boxX + 12, popupY + 38);

        ctx.fillStyle = "#ffed00";
        ctx.font = "bold 12px 'ouroboros'";
        ctx.fillText("Новое достижение!", boxX + 48, popupY + 22);

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 14px 'ouroboros'";
        ctx.fillText(currentAchievementPopup.name, boxX + 48, popupY + 44);
        ctx.restore();

        if (achievementPopupTimer <= 0) currentAchievementPopup = null;
    }
}

function stopAllBgMusic() {

}

function playBgTrack(targetTrack) {
    if (currentBgAudio !== targetTrack) {
        if (currentBgAudio) currentBgAudio.pause();
        currentBgAudio = targetTrack;
        currentBgAudio.volume = musicVolume;
        currentBgAudio.play().catch(() => {});
    } else {
        if (currentBgAudio.paused) {
            currentBgAudio.volume = musicVolume;
            currentBgAudio.play().catch(() => {});
        }
    }
}

function updateModeMusic() {
    if (state !== "game") {
        if (currentBgAudio) currentBgAudio.pause();
        return;
    }

    if (bossCutscenePhase && bossCutscenePhase !== 'battle') {
        stopAllBgMusic();
        currentBgAudio = null;
        return;
    }

    if (level === 4 || bossCutscenePhase === 'battle') {
        playBgTrack(sndBossBg);
    }
    else if (isGlitchMode) playBgTrack(sndGlitchBg);
    else if (isTimeParadox) playBgTrack(sndTimeBg);
    else if (isNyanMode) playBgTrack(sndNyanBg);
    else if (isCyberMode) playBgTrack(sndCyberBg);
    else if (level === 2) playBgTrack(sndWinterBg);
    else if (level === 3) playBgTrack(sndAutumnBg);
    else playBgTrack(bgMusic);
}

function drawAutumnBackground() {
    let grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#3d2635");
    grad.addColorStop(1, "#8c4627");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    if (loadedImages['spiderWeb']) {
        let img = images['spiderWeb'];
        let webSize = Math.min(W, H) * 0.35;
        ctx.drawImage(img, 0, 0, webSize, webSize);
        ctx.save();
        ctx.translate(W, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(img, 0, 0, webSize, webSize);
        ctx.restore();
    }
}

function drawBossBackground() {
    let grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, "#0c0217");
    grad.addColorStop(0.45, "#250529");
    grad.addColorStop(1, "#440a2c");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    let portalX = W / 2;
    let portalY = Math.max(90, H * 0.22);
    let pulse = 0.5 + 0.15 * Math.sin(Date.now() / 300);
    let portalR = Math.min(W * 0.4, 130);
    
    let portalGrad = ctx.createRadialGradient(portalX, portalY, 15, portalX, portalY, portalR * 1.5);
    portalGrad.addColorStop(0, "rgba(255, 40, 100, " + (0.5 * pulse) + ")");
    portalGrad.addColorStop(0.6, "rgba(140, 15, 80, " + (0.3 * pulse) + ")");
    portalGrad.addColorStop(1, "rgba(0, 0, 0, 0)");
    
    ctx.save();
    ctx.fillStyle = portalGrad;
    ctx.beginPath();
    ctx.arc(portalX, portalY, portalR * 1.5, 0, Math.PI * 2);
    ctx.fill();

    if (Math.random() < 0.18) {
        sparkParticles.push({
            x: Math.random() * W,
            y: H + 10,
            vx: (Math.random() - 0.5) * 1.5,
            vy: -(Math.random() * 2 + 1),
            size: Math.random() * 3 + 2,
            color: Math.random() < 0.5 ? "#ff3366" : "#ffbd59",
            alpha: 0.9
        });
    }
    ctx.restore();
}

function drawNyanBackground() {
    ctx.fillStyle = "#0f051d"; 
    ctx.fillRect(0, 0, W, H);

    nyanStars.forEach(s => {
        ctx.fillStyle = s.color;
        ctx.fillRect(s.x, s.y, s.size, s.size);
        if (state === "game") {
            s.x -= s.speed;
            if (s.x < -10) { 
                s.x = W + 10; 
                s.y = Math.random() * H; 
            }
        }
    });

    const bandHeight = 6;
    const startY = cat.y - (nyanRainbowColors.length * bandHeight) / 2;
    nyanRainbowColors.forEach((color, index) => {
        ctx.fillStyle = color;
        ctx.fillRect(0, startY + index * bandHeight, Math.max(0, cat.x - 10), bandHeight);
    });
}

function saveCollection() {

    for (let key in itemsDB) toSaveItems[key] = itemsDB[key].unlocked;
    for (let key in skinsDB) toSaveSkins[key] = skinsDB[key].unlocked;
    for (let key in achievementsDB) toSaveAchievements[key] = achievementsDB[key].unlocked;
    localStorage.setItem("catCollection", JSON.stringify(toSaveItems));
    localStorage.setItem("catSkinsCollection", JSON.stringify(toSaveSkins));
    localStorage.setItem("catCurrentSkin", currentSkin);
    localStorage.setItem("catAchievementsCollection", JSON.stringify(toSaveAchievements));
}

function startDevHold(e) {

    const rect = canvas.getBoundingClientRect();
    const touch = e.touches ? e.touches[0] : e;
    const clientX = (touch.clientX - rect.left) * (W / rect.width);
    const clientY = (touch.clientY - rect.top) * (H / rect.height);
    if (clientX < 80 && clientY < 80) {
        clearTimeout(devHoldTimer);
        devHoldTimer = setTimeout(() => {
            playSound(sndClick);
            if (debugMenu) debugMenu.style.display = 'flex';

}

function wrapText(text, x, y, maxWidth, lineHeight) {
    const words = text.split(' ');
    let line = '';
    for (let n = 0; n < words.length; n++) {
        let testLine = line + words[n] + ' ';
        let metrics = ctx.measureText(testLine);
        if (metrics.width > maxWidth && n > 0) {
            ctx.fillText(line, x, y);
            line = words[n] + ' ';
            y += lineHeight;
        } else {
            line = testLine;
        }
    }
    ctx.fillText(line, x, y);
}

function spawnItemWave() {
    if (isUmbrellaMode || level === 4 || bossCutscenePhase !== null) return;

    let badType = "bomb";
    let goodType = "star";
    if (level === 2) {
        badType = "fire";
        goodType = "icestar";
    } else if (level === 3) {
        badType = "knife";
        goodType = "goldenStar";
    }

    let speedMult = levelSettings[level].speed * (isGlitchMode ? 1.3 : 1.0);
    let waveSpeed = 2.8 * speedMult;

    if (isNyanMode) {
        const numSlots = Math.max(4, Math.min(7, Math.floor((H - 80) / 75)));
        const slotH = (H - 80) / numSlots;
        const safeIndex = Math.floor(Math.random() * numSlots);
        for (let k = 0; k < numSlots; k++) {
            let itemY = 40 + slotH * (k + 0.5);
            let isSafe = (k === safeIndex);
            items.push({
                x: W + 50,
                y: itemY,
                type: isSafe ? goodType : badType,
                points: isSafe ? (itemsDB[goodType] ? 2 : 1) : 0,
